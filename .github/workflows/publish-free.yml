name: Publish AltTab Free release
on:
  workflow_dispatch:
  push:
    branches: [free-self-build]
    paths: ['.github/workflows/publish-free.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AltTab-Free-macOS
          run-id: 40116220982
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify app and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=$(awk '{print $1}' AltTab-Free-macOS.zip.sha256)
          actual=$(shasum -a 256 AltTab-Free-macOS.zip | awk '{print $1}')
          test "$expected" = "$actual"
          printf '%s  AltTab-Free-macOS.zip\n' "$actual" > AltTab-Free-macOS.zip.sha256
          ditto -x -k AltTab-Free-macOS.zip "$RUNNER_TEMP/verified-app"
          app="$RUNNER_TEMP/verified-app/AltTab.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = AltTab
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = app.icns
          test "$(shasum -a 256 "$app/Contents/Resources/app.icns" | awk '{print $1}')" = e77c3c145e867eaee6a56e9ddd073bab44bb01ca5f4079ce4190da34a205c80a
          test "$(shasum -a 256 "$app/Contents/Resources/app.png" | awk '{print $1}')" = 614b0d740fd4a8f624be0a98f0cad5fe28b81f2806304f7e953951e2fd767dc2
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/verified-app/AltTab.app"
      - name: Publish release on fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: k24139/alt-tab
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Restores the classic stacked-window icon and names the application **AltTab** (`AltTab.app`). The fork bundle identifier remains unchanged, so existing fork settings and permission records stay associated with the app.

          All local AltTab features are free. Licensing, trial restrictions, purchase screens, and update checks and prompts have been removed.

          **Platform:** Apple Silicon Macs, macOS 12 or later. Intel support is not included in this build.

          Download `AltTab-Free-macOS.zip`, extract it, and move `AltTab.app` to Applications. Quit official AltTab to avoid shortcut conflicts. Grant Accessibility and Screen Recording permissions when requested.

          The app is signed ad hoc for local use and is not Apple-notarized. The Release build and signature verification passed on GitHub Actions. Live macOS integration testing and the full XCTest suite remain pending.

          Built from commit `87b18a80b7b6f7331d8ea769a54d776b93391680` in https://github.com/k24139/alt-tab/actions/runs/40116220982. Corresponding source is included through GitHub's source archives. GPL-3.0 licensing and upstream attribution remain intact.
          NOTES
          gh release create v11.10.1-free.2 --target 87b18a80b7b6f7331d8ea769a54d776b93391680 --title 'AltTab 11.10.1 — Classic Icon' --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release upload v11.10.1-free.2 release-assets/AltTab-Free-macOS.zip release-assets/AltTab-Free-macOS.zip.sha256
          gh release edit v11.10.1-free.2 --draft=false --latest
