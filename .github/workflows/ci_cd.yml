name: Free source checks
on:
  push:
    branches: [master, free-self-build]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/test_free_source.sh
      - run: python3 scripts/assets/compile_illustrations.py --check
      - run: python3 scripts/assets/test_compile_illustrations.py
